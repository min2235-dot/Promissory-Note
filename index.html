<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本票產生器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --red: #c0392b;
    --gold: #b8860b;
    --paper: #faf7f2;
    --rule: #d4c9b0;
    --field-bg: #fff;
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: #f0ece4;
    color: var(--ink);
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 31px, #d4c9b0 31px, #d4c9b0 32px),
      repeating-linear-gradient(90deg, transparent, transparent 31px, #d4c9b0 31px, #d4c9b0 32px);
    background-size: 32px 32px;
  }

  header {
    background: var(--ink);
    color: white;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 3px solid var(--red);
  }

  header .seal {
    width: 48px; height: 48px;
    border: 2px solid var(--red);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--red);
    font-family: 'Noto Serif TC', serif;
    font-size: 11px;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 4px;
  }

  header p {
    font-size: 12px;
    color: #aaa;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .container {
    max-width: 860px;
    margin: 40px auto;
    padding: 0 20px 80px;
  }

  /* Steps */
  .steps {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .step {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    font-size: 12px;
    color: #999;
    cursor: pointer;
    border-right: 1px solid var(--rule);
    transition: all 0.2s;
    position: relative;
  }

  .step:last-child { border-right: none; }

  .step.active {
    background: var(--ink);
    color: white;
  }

  .step.done {
    background: #e8f5e9;
    color: #2e7d32;
  }

  .step .num {
    display: block;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Noto Serif TC', serif;
    margin-bottom: 2px;
  }

  /* Panel */
  .panel {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
  }

  .panel.active { display: block; }

  .panel-header {
    background: var(--ink);
    color: white;
    padding: 14px 24px;
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panel-header .tag {
    background: var(--red);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 1px;
  }

  .panel-body { padding: 28px 28px; }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--rule);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: white;
    margin-bottom: 20px;
  }

  .upload-zone:hover, .upload-zone.drag { border-color: var(--ink); background: #f5f5f5; }

  .upload-zone.has-file { border-color: #2e7d32; background: #f1f8f1; }

  .upload-zone .icon { font-size: 32px; margin-bottom: 10px; }

  .upload-zone p { font-size: 13px; color: #666; margin-top: 4px; }

  .upload-zone strong { font-size: 14px; color: var(--ink); }

  .upload-zone input { display: none; }

  /* Issuer card */
  .issuer-card {
    background: white;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .issuer-header {
    background: #f5f0e8;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule);
  }

  .issuer-header span {
    font-family: 'Noto Serif TC', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 1px;
  }

  .type-toggle {
    display: flex;
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }

  .type-toggle button {
    padding: 4px 12px;
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    border: none;
    background: white;
    cursor: pointer;
    color: #666;
    transition: all 0.15s;
  }

  .type-toggle button.active {
    background: var(--ink);
    color: white;
  }

  .issuer-fields { padding: 16px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .field-row.full { grid-template-columns: 1fr; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 11px;
    color: #888;
    letter-spacing: 1px;
    font-weight: 500;
  }

  .field input {
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    background: var(--field-bg);
    transition: border-color 0.15s;
    width: 100%;
  }

  .field input:focus {
    outline: none;
    border-color: var(--ink);
  }

  /* Add issuer */
  .add-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: white;
    border: 1px dashed var(--rule);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    color: #666;
    width: 100%;
    margin-bottom: 20px;
    transition: all 0.15s;
  }

  .add-btn:hover { border-color: var(--ink); color: var(--ink); background: #f9f9f9; }

  /* Amount */
  .amount-block {
    background: white;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }

  .amount-block label {
    font-size: 11px;
    color: #888;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .amount-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .amount-input-wrap span {
    font-size: 14px;
    color: #666;
    white-space: nowrap;
  }

  .amount-input-wrap input {
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 16px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    width: 100%;
    transition: border-color 0.15s;
  }

  .amount-input-wrap input:focus { outline: none; border-color: var(--ink); }

  .amount-chinese {
    margin-top: 8px;
    font-family: 'Noto Serif TC', serif;
    font-size: 13px;
    color: var(--red);
    min-height: 20px;
    letter-spacing: 2px;
  }

  /* Preview table */
  .preview-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 20px;
  }

  .preview-table th {
    background: var(--ink);
    color: white;
    padding: 8px 14px;
    text-align: left;
    font-weight: 400;
    letter-spacing: 1px;
    font-size: 12px;
  }

  .preview-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    background: white;
  }

  .preview-table tr:last-child td { border-bottom: none; }

  .preview-table .label { color: #888; font-size: 11px; width: 120px; }

  .preview-table .value { color: var(--ink); font-family: 'Noto Serif TC', serif; }

  /* Buttons */
  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--ink);
    color: white;
  }

  .btn-primary:hover { background: #2d2d4e; }

  .btn-secondary {
    background: white;
    color: var(--ink);
    border: 1px solid var(--rule);
  }

  .btn-secondary:hover { background: #f0f0f0; }

  .btn-red {
    background: var(--red);
    color: white;
  }

  .btn-red:hover { background: #a93226; }

  .btn-group {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    padding-top: 8px;
  }

  /* Progress / loading */
  .loading {
    text-align: center;
    padding: 40px;
    display: none;
  }

  .loading.active { display: block; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--rule);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Success */
  .success-block {
    text-align: center;
    padding: 40px 20px;
    display: none;
  }

  .success-block.active { display: block; }

  .success-block .big-seal {
    width: 80px; height: 80px;
    border: 3px solid var(--red);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    color: var(--red);
  }

  .success-block h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .success-block p { color: #666; font-size: 13px; margin-bottom: 24px; }

  /* Remove btn */
  .remove-issuer {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    transition: color 0.15s;
  }

  .remove-issuer:hover { color: var(--red); }

  /* Responsive */
  @media (max-width: 600px) {
    .field-row { grid-template-columns: 1fr; }
    header { padding: 16px 20px; }
    .panel-body { padding: 20px 16px; }
    .btn-group { flex-direction: column; }
    .btn { width: 100%; text-align: center; }
  }

  .divider {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 20px 0;
  }

  .hint {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <div class="seal">本票</div>
  <div>
    <h1>本　票　產　生　器</h1>
    <p>台灣聯合金融科技股份有限公司　／　BZNK 必可企業募資平台</p>
  </div>
</header>

<div class="container">

  <!-- Steps -->
  <div class="steps">
    <div class="step active" id="step1-tab" onclick="goStep(1)">
      <span class="num">①</span>上傳本票
    </div>
    <div class="step" id="step2-tab" onclick="goStep(2)">
      <span class="num">②</span>填寫資料
    </div>
    <div class="step" id="step3-tab" onclick="goStep(3)">
      <span class="num">③</span>確認產生
    </div>
  </div>

  <!-- Step 1: Upload blank PDF -->
  <div class="panel active" id="panel1">
    <div class="panel-header">
      <span>上傳空白本票 PDF</span>
      <span class="tag">STEP 1</span>
    </div>
    <div class="panel-body">
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('pdfInput').click()">
        <div class="icon">📄</div>
        <strong id="uploadLabel">點擊或拖曳上傳空白本票 PDF</strong>
        <p>支援格式：PDF　／　檔案不會上傳至任何伺服器</p>
        <input type="file" id="pdfInput" accept=".pdf" onchange="handlePdfUpload(this)">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="goStep(2)" id="toStep2Btn" disabled>下一步　→</button>
      </div>
    </div>
  </div>

  <!-- Step 2: Fill data -->
  <div class="panel" id="panel2">
    <div class="panel-header">
      <span>填寫發票人資料與金額</span>
      <span class="tag">STEP 2</span>
    </div>
    <div class="panel-body">

      <div id="issuersContainer"></div>

      <button class="add-btn" onclick="addIssuer()" id="addIssuerBtn">
        ＋　新增發票人（最多 5 位）
      </button>

      <hr class="divider">

      <!-- Amount -->
      <div class="amount-block">
        <label>本票金額</label>
        <div class="amount-input-wrap">
          <span>新台幣</span>
          <input type="number" id="amountInput" placeholder="請輸入金額（整數）" oninput="updateChinese()" min="1">
          <span>元整</span>
        </div>
        <div class="amount-chinese" id="amountChinese"></div>
        <p class="hint">※ 請輸入阿拉伯數字，大寫金額將自動換算</p>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" onclick="goStep(1)">← 上一步</button>
        <button class="btn btn-primary" onclick="goStep(3)">下一步　→</button>
      </div>
    </div>
  </div>

  <!-- Step 3: Preview & Generate -->
  <div class="panel" id="panel3">
    <div class="panel-header">
      <span>確認資料並產生本票</span>
      <span class="tag">STEP 3</span>
    </div>
    <div class="panel-body">
      <div id="previewContent"></div>

      <div class="loading" id="loadingBlock">
        <div class="spinner"></div>
        <p>正在產生本票 PDF，請稍候…</p>
      </div>

      <div class="success-block" id="successBlock">
        <div class="big-seal">印</div>
        <h2>本票已產生完成</h2>
        <p>請檢查下載的 PDF 是否填寫正確</p>
        <button class="btn btn-red" onclick="generatePdf()">重新產生</button>
      </div>

      <div id="previewActions" class="btn-group">
        <button class="btn btn-secondary" onclick="goStep(2)">← 修改資料</button>
        <button class="btn btn-red" onclick="startGenerate()">產生本票 PDF　▶</button>
      </div>
    </div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────
let blankPdfBytes = null;
let issuers = [];

// ── Step navigation ────────────────────────────────────
function goStep(n) {
  [1,2,3].forEach(i => {
    document.getElementById(`panel${i}`).classList.toggle('active', i === n);
    const tab = document.getElementById(`step${i}-tab`);
    tab.classList.remove('active','done');
    if (i === n) tab.classList.add('active');
    else if (i < n) tab.classList.add('done');
  });
  if (n === 3) renderPreview();
}

// ── Upload ─────────────────────────────────────────────
const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.type === 'application/pdf') loadPdf(f);
});

function handlePdfUpload(input) {
  if (input.files[0]) loadPdf(input.files[0]);
}

function loadPdf(file) {
  const reader = new FileReader();
  reader.onload = e => {
    blankPdfBytes = new Uint8Array(e.target.result);
    uploadZone.classList.add('has-file');
    document.getElementById('uploadLabel').textContent = '✓ ' + file.name;
    document.getElementById('toStep2Btn').disabled = false;
  };
  reader.readAsArrayBuffer(file);
}

// ── Issuers ─────────────────────────────────────────────
function initIssuers() {
  issuers = [
    { type:'公司', name:'', id:'', address:'', representative:'' },
    { type:'個人', name:'', id:'', address:'', representative:'' }
  ];
  renderIssuers();
}

function addIssuer() {
  if (issuers.length >= 5) return;
  issuers.push({ type:'個人', name:'', id:'', address:'', representative:'' });
  renderIssuers();
}

function removeIssuer(idx) {
  if (issuers.length <= 1) return;
  issuers.splice(idx, 1);
  renderIssuers();
}

function setType(idx, type) {
  issuers[idx].type = type;
  renderIssuers();
}

function renderIssuers() {
  const c = document.getElementById('issuersContainer');
  c.innerHTML = '';
  issuers.forEach((iss, i) => {
    const card = document.createElement('div');
    card.className = 'issuer-card';
    card.innerHTML = `
      <div class="issuer-header">
        <span>發票人 ${i+1}</span>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="type-toggle">
            <button class="${iss.type==='公司'?'active':''}" onclick="setType(${i},'公司')">公司</button>
            <button class="${iss.type==='個人'?'active':''}" onclick="setType(${i},'個人')">個人</button>
          </div>
          ${issuers.length > 1 ? `<button class="remove-issuer" onclick="removeIssuer(${i})" title="移除">✕</button>` : ''}
        </div>
      </div>
      <div class="issuer-fields">
        <div class="field-row">
          <div class="field">
            <label>${iss.type==='公司'?'公司名稱':'姓名'}</label>
            <input type="text" value="${iss.name}" placeholder="${iss.type==='公司'?'例：湧笙興業有限公司':'例：洪子婷'}"
              oninput="issuers[${i}].name=this.value">
          </div>
          <div class="field">
            <label>${iss.type==='公司'?'統一編號':'身分證字號'}</label>
            <input type="text" value="${iss.id}" placeholder="${iss.type==='公司'?'8碼':'10碼'}"
              oninput="issuers[${i}].id=this.value">
          </div>
        </div>
        <div class="field-row full">
          <div class="field">
            <label>${iss.type==='公司'?'公司地址':'戶籍地址'}</label>
            <input type="text" value="${iss.address}" placeholder="請輸入完整地址"
              oninput="issuers[${i}].address=this.value">
          </div>
        </div>
        ${iss.type==='公司' ? `
        <div class="field-row">
          <div class="field">
            <label>負責人姓名</label>
            <input type="text" value="${iss.representative}" placeholder="例：洪子婷"
              oninput="issuers[${i}].representative=this.value">
          </div>
        </div>` : ''}
      </div>`;
    c.appendChild(card);
  });
  document.getElementById('addIssuerBtn').style.display = issuers.length >= 5 ? 'none' : 'flex';
}

// ── Chinese amount ──────────────────────────────────────
const CN = {0:'零',1:'壹',2:'貳',3:'參',4:'肆',5:'伍',6:'陸',7:'柒',8:'捌',9:'玖'};

function numToChinese(n) {
  if (!n || n <= 0) return '';
  n = Math.floor(n);
  const units4 = ['仟','佰','拾',''];
  function sec(num) {
    let r = '';
    for (let i=0;i<4;i++) {
      const d = Math.floor(num / Math.pow(10, 3-i)) % 10;
      if (d) r += CN[d] + units4[i];
      else if (r && r[r.length-1] !== '零') r += '零';
    }
    return r.replace(/零+$/, '');
  }
  const yi = Math.floor(n/100000000);
  const wan = Math.floor(n%100000000/10000);
  const ge = n%10000;
  let r = '';
  if (yi) r += sec(yi)+'億';
  if (wan) { if (yi && wan<1000) r+='零'; r+=sec(wan)+'萬'; }
  if (ge) { if ((yi||wan) && ge<1000) r+='零'; r+=sec(ge); }
  return r.replace(/零+$/, '') || '零';
}

function updateChinese() {
  const v = parseInt(document.getElementById('amountInput').value);
  document.getElementById('amountChinese').textContent = v > 0 ? '大寫：' + numToChinese(v) + '元整' : '';
}

// ── Preview ─────────────────────────────────────────────
function renderPreview() {
  const amount = parseInt(document.getElementById('amountInput').value) || 0;
  let html = '';

  issuers.forEach((iss, i) => {
    if (!iss.name) return;
    const nameStr = iss.type==='公司' && iss.representative ? `${iss.name}　${iss.representative}` : iss.name;
    html += `
    <table class="preview-table" style="margin-bottom:16px">
      <thead><tr><th colspan="2">發票人 ${i+1}（${iss.type}）</th></tr></thead>
      <tbody>
        <tr><td class="label">${iss.type==='公司'?'公司名稱':'姓名'}</td><td class="value">${nameStr}</td></tr>
        <tr><td class="label">${iss.type==='公司'?'統一編號':'身分證字號'}</td><td class="value">${iss.id}</td></tr>
        <tr><td class="label">地址</td><td class="value">${iss.address}</td></tr>
      </tbody>
    </table>`;
  });

  html += `
  <table class="preview-table">
    <thead><tr><th colspan="2">本票金額</th></tr></thead>
    <tbody>
      <tr><td class="label">金額</td><td class="value" style="color:var(--red);font-size:15px">新台幣 ${amount.toLocaleString()} 元整</td></tr>
      <tr><td class="label">大寫</td><td class="value">${numToChinese(amount)}元整</td></tr>
    </tbody>
  </table>`;

  document.getElementById('previewContent').innerHTML = html;
  document.getElementById('loadingBlock').classList.remove('active');
  document.getElementById('successBlock').classList.remove('active');
  document.getElementById('previewActions').style.display = 'flex';
}

// ── PDF Generation ──────────────────────────────────────
function startGenerate() {
  document.getElementById('previewActions').style.display = 'none';
  document.getElementById('loadingBlock').classList.add('active');
  setTimeout(generatePdf, 100);
}

function ptToMm(pt) { return pt * 25.4 / 72.0; }
function ptToPdfPt(pt) { return pt; } // pdf-lib uses points directly

async function generatePdf() {
  try {
    const { PDFDocument, rgb, StandardFonts } = PDFLib;

    if (!blankPdfBytes) {
      alert('請先上傳空白本票 PDF');
      goStep(1);
      return;
    }

    const amount = parseInt(document.getElementById('amountInput').value) || 0;

    // Pad issuers to 5
    const iss = [...issuers];
    while (iss.length < 5) iss.push({ type:'個人', name:'', id:'', address:'', representative:'' });

    const pdfDoc = await PDFDocument.load(blankPdfBytes, { ignoreEncryption: true });

    // Embed font — use a CJK-compatible approach
    // We'll embed Helvetica for numbers and try to handle CJK via existing content
    // For CJK text we need to embed a font; we'll use the page's existing resources
    // Since pdf-lib doesn't support CJK out of the box without a font file,
    // we'll embed text as form fields or use the existing font in the PDF.

    // Try to load a CJK font from Google Fonts CDN as ArrayBuffer
    let fontBytes;
    try {
      const res = await fetch('https://fonts.gstatic.com/s/notosanstc/v35/nKKF-GM_FYFRJvXzVXaAPe97P1KHynJnSg.woff2');
      // woff2 won't work directly, use a fallback approach
      fontBytes = null;
    } catch(e) { fontBytes = null; }

    // Since CJK font embedding is complex in pdf-lib without the TTF file,
    // we'll draw text using a canvas-overlay approach:
    // Draw all text on a canvas, convert to image, stamp on PDF

    const page = pdfDoc.getPages()[0];
    const { width, height } = page.getSize();

    // Create an offscreen canvas matching the PDF page size
    const canvas = document.createElement('canvas');
    const scale = 2; // retina
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.font = '10px "Noto Sans TC"';
    ctx.fillStyle = 'black';

    function nameDisplay(issuer) {
      if (issuer.type === '公司' && issuer.representative)
        return `${issuer.name}  ${issuer.representative}`;
      return issuer.name;
    }

    function amount8digits(n) {
      return String(n).padStart(8,'0').slice(-8).split('');
    }

    // Helper: draw text fit into max width at (x, y) in PDF points
    // PDF coords: origin bottom-left, y increases upward
    // Canvas coords: origin top-left
    function cvY(pdfY) { return height - pdfY; }

    function drawFit(text, x, pdfY, maxW, fontSize=10) {
      if (!text) return;
      ctx.font = `${fontSize}px "Noto Sans TC"`;
      let sz = fontSize;
      while (sz >= 6 && ctx.measureText(text).width > maxW) {
        sz -= 0.5;
        ctx.font = `${sz}px "Noto Sans TC"`;
      }
      ctx.fillText(text, x, cvY(pdfY));
    }

    function drawCenter(text, x0, x1, pdfY, fontSize=10) {
      if (!text) return;
      ctx.font = `${fontSize}px "Noto Sans TC"`;
      let sz = fontSize;
      while (sz >= 6 && ctx.measureText(text).width > (x1-x0)) {
        sz -= 0.5;
        ctx.font = `${sz}px "Noto Sans TC"`;
      }
      const tw = ctx.measureText(text).width;
      ctx.fillText(text, x0 + (x1-x0-tw)/2, cvY(pdfY));
    }

    // Draw amount digits
    if (amount) {
      // White out the zero boxes first
      ctx.fillStyle = 'white';
      const zeros = [[295.4,82.0,307.4,95.0],[333.2,82.0,345.2,95.0],[367.4,81.5,379.4,95.0],[407.8,82.5,419.8,95.5]];
      zeros.forEach(([x0,y0,x1,y1]) => {
        ctx.fillRect(x0-1, cvY(y1+0.5), (x1-x0+2), (y1-y0+1));
      });

      ctx.fillStyle = 'black';
      ctx.font = '11px "Noto Sans TC"';
      const xPositions = [148,184,220,256,292,328,364,400];
      const digits = amount8digits(amount);
      digits.forEach((d, idx) => {
        const x = xPositions[idx];
        const text = CN[parseInt(d)];
        const tw = ctx.measureText(text).width;
        ctx.fillText(text, x + 15 - tw/2, cvY(86));
      });

      // Chinese amount
      ctx.font = '10px "Noto Sans TC"';
      drawCenter(numToChinese(amount), 167.8, 348.4, 563.8);
    }

    ctx.fillStyle = 'black';

    // Issuer 1 (top main section)
    drawFit(nameDisplay(iss[0]), 126, 160.3, 200);
    drawFit(iss[0].id, 215, 180.8, 330);
    drawFit(iss[0].address, 121, 200.0, 430);

    // Issuers 2-5 (grid section)
    drawFit(nameDisplay(iss[1]), 126, 243.9, 148);
    drawFit(iss[1].id, 215, 263.6, 100);
    drawFit(iss[1].address, 121, 283.8, 148);

    drawFit(nameDisplay(iss[2]), 382, 243.9, 138);
    drawFit(iss[2].id, 470, 263.6, 85);
    drawFit(iss[2].address, 380, 283.8, 170);

    drawFit(nameDisplay(iss[3]), 126, 326.8, 148);
    drawFit(iss[3].id, 217, 346.4, 100);
    drawFit(iss[3].address, 121, 365.9, 148);

    drawFit(nameDisplay(iss[4]), 382, 326.8, 138);
    drawFit(iss[4].id, 472, 346.4, 85);
    drawFit(iss[4].address, 380, 365.9, 170);

    // Declaration section (lower half)
    drawFit(nameDisplay(iss[0]), 140, 644.8, 140);
    drawFit(nameDisplay(iss[1]), 130, 685.9, 90);
    drawFit(nameDisplay(iss[2]), 385, 685.9, 90);
    drawFit(nameDisplay(iss[3]), 130, 726.9, 90);
    drawFit(nameDisplay(iss[4]), 385, 726.9, 90);

    // Convert canvas to PNG and embed in PDF
    const imgData = canvas.toDataURL('image/png');
    const imgBytes = await fetch(imgData).then(r => r.arrayBuffer());
    const pngImage = await pdfDoc.embedPng(imgBytes);

    page.drawImage(pngImage, {
      x: 0,
      y: 0,
      width: width,
      height: height,
    });

    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '本票.pdf';
    a.click();
    URL.revokeObjectURL(url);

    document.getElementById('loadingBlock').classList.remove('active');
    document.getElementById('successBlock').classList.add('active');

  } catch(err) {
    document.getElementById('loadingBlock').classList.remove('active');
    document.getElementById('previewActions').style.display = 'flex';
    alert('產生失敗：' + err.message);
    console.error(err);
  }
}

initIssuers();
